name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Prepare
        run: |
          mkdir -p kochgramm
          cp kochgrammApp.swift kochgramm/
          cp Info.plist kochgramm/
          cp AppIcon.png kochgramm/
          
          # Создаём Assets.xcassets с иконкой
          mkdir -p kochgramm/Assets.xcassets/AppIcon.appiconset
          
          # Генерируем иконки нужных размеров (iOS требует 120x120 и 1024x1024)
          sips -z 120 120 AppIcon.png --out kochgramm/Assets.xcassets/AppIcon.appiconset/icon-120.png
          sips -z 180 180 AppIcon.png --out kochgramm/Assets.xcassets/AppIcon.appiconset/icon-180.png
          sips -z 1024 1024 AppIcon.png --out kochgramm/Assets.xcassets/AppIcon.appiconset/icon-1024.png
          
          # Создаём Contents.json для набора иконок
          cat > kochgramm/Assets.xcassets/AppIcon.appiconset/Contents.json << 'EOF'
          {
            "images" : [
              { "size" : "60x60", "idiom" : "iphone", "filename" : "icon-120.png", "scale" : "2x" },
              { "size" : "60x60", "idiom" : "iphone", "filename" : "icon-180.png", "scale" : "3x" },
              { "size" : "1024x1024", "idiom" : "ios-marketing", "filename" : "icon-1024.png", "scale" : "1x" }
            ],
            "info" : { "version" : 1, "author" : "xcode" }
          }
          EOF
          
          # Создаём корневой Contents.json для Assets.xcassets
          cat > kochgramm/Assets.xcassets/Contents.json << 'EOF'
          { "info" : { "version" : 1, "author" : "xcode" } }
          EOF
          
          cd kochgramm
          
          # Главное изменение: Assets.xcassets добавлен в sources!
          cat > project.yml << 'EOF'
          name: kochgramm
          options:
            deploymentTarget:
              iOS: "16.0"
          targets:
            kochgramm:
              type: application
              platform: iOS
              sources:
                - kochgrammApp.swift
                - Assets.xcassets
              info:
                path: Info.plist
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.kochgramm.app
                  GENERATE_INFOPLIST_FILE: NO
                  INFOPLIST_FILE: Info.plist
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  SWIFT_VERSION: "5.0"
          EOF

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate
        run: |
          cd kochgramm
          xcodegen generate

      - name: Build
        run: |
          cd kochgramm
          xcodebuild build \
            -project kochgramm.xcodeproj \
            -scheme kochgramm \
            -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          
          mkdir Payload
          cp -r build/Build/Products/Debug-iphoneos/kochgramm.app Payload/
          zip -r kochgramm.ipa Payload

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kochgramm-IPA
          path: kochgramm/kochgramm.ipa
