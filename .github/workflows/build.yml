name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Prepare Project Structure
        run: |
          mkdir -p kochgramm
          cp *.swift kochgramm/
          cp Info.plist kochgramm/
          
          cat > kochgramm/project.yml << 'EOF'
          name: kochgramm
          options:
            bundleIdPrefix: com.kochgramm
            deploymentTarget:
              iOS: "16.0"
          targets:
            kochgramm:
              type: application
              platform: iOS
              sources: [.]
              info:
                path: Info.plist
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.kochgramm.app
                  GENERATE_INFOPLIST_FILE: NO
                  INFOPLIST_FILE: Info.plist
          EOF

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd kochgramm
          xcodegen generate

      - name: Build IPA
        run: |
          cd kochgramm
          xcodebuild clean build \
            -project kochgramm.xcodeproj \
            -scheme kochgramm \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/kochgramm.app Payload/
          zip -r kochgramm.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: kochgramm-IPA
          path: kochgramm/kochgramm.ipa
