name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Prepare
        run: |
          mkdir -p kochgramm
          cp kochgrammApp.swift kochgramm/
          cp Info.plist kochgramm/
          cd kochgramm
          cat > project.yml << 'EOF'
          name: kochgramm
          options:
            deploymentTarget:
              iOS: "16.0"
          targets:
            kochgramm:
              type: application
              platform: iOS
              sources: [kochgrammApp.swift]
              info:
                path: Info.plist
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.kochgramm.app
                  GENERATE_INFOPLIST_FILE: NO
                  INFOPLIST_FILE: Info.plist
                  SWIFT_VERSION: "5.0"
          EOF

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate
        run: |
          cd kochgramm
          xcodegen generate

      - name: Build
        run: |
          cd kochgramm
          xcodebuild build \
            -project kochgramm.xcodeproj \
            -scheme kochgramm \
            -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          
          mkdir Payload
          cp -r build/Build/Products/Debug-iphoneos/kochgramm.app Payload/
          zip -r kochgramm.ipa Payload

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kochgramm-IPA
          path: kochgramm/kochgramm.ipa
